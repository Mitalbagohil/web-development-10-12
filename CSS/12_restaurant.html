<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Restaurant</title>
    <style>
        body{
            margin:0px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fff8f0;
        }
        header{
            background-color: #e63946;
            color: white;
            padding: 25px;
            text-align: center;
        }
        nav a{
            color: white;
            text-decoration: none;
            margin: 20px;
        }
        .container{
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 30px;
        }
        .food{
            background-color: white;
            width: 250px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ccc;
        }
        .food img{
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }
        button{
            background-color: black;
            transform: scale(1.2);
            background-color: green;
            box-shadow: 0 5px 10px gray;
        }
    </style>
</head>
<body>
    <header>
        <h1>Foodie Restaurant</h1>
        <p>Delicious Food , Happy Life</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="container">
        <div class="food">
            <img src="https://picsum.photos/500?random=1" alt="">
            <h2>Pizza</h2>
            <p>Cheesy And Delicious </p>
            <button>Order Now</button>
        </div>
        <div class="food">
            <img src="https://picsum.photos/500?random=2" alt="">
            <h2>Burger</h2>
            <p>Fresh And Testy Burger </p>
            <button>Order Now</button>
        </div>
        <div class="food">
            <img src="https://picsum.photos/500?random=3" alt="">
            <h2>Grilled Food</h2>
            <p>Enjoy Our Special Food</p>
            <button>Order Now</button>
        </div>
    </div>
</body>
</html>
